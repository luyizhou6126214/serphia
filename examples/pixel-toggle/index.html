<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>像素日夜开关</title>
    <style>
      body {
        margin: 0;
        min-width: 0;
        color: #262526;
        background: #f4f4f4;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        box-sizing: border-box;
        max-width: 768px;
        margin-inline: auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 24px;
        font-weight: 650;
      }
      .preview {
        overflow: hidden;
        border-radius: 16px;
      }
      .demo-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        margin-top: 14px;
      }
      .copy-example {
        padding: 6px 10px;
        border: 1px solid #cac8c7;
        border-radius: 7px;
        background: #fff;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .demo-actions output {
        color: #504e4d;
      }
      @media (max-width: 480px) {
        main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="demo"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
