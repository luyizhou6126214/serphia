<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">Serphia · 短发女孩</title>
  <desc id="description">墨绿色方块里，一个留齐刘海和波波头的小女孩从右下方探头，眨眼微笑。</desc>
  <metadata>内置 imagegen 生成草图，随后重绘矢量。生成提示词：把参考图标中的角色改成一个一眼就能看出是人类小女孩的卡通头像，删除原来的单簇卷毛。沿用其墨绿与奶白双色、俏皮眨眼笑脸、右下角探头近景与圆角方块。重新设计成有平滑圆弧形头顶、齐耳短波波头和整齐短刘海的小女孩，头顶轮廓完整光滑，绝对没有翘毛、单簇头发、发髻或头饰。圆脸、小耳朵，齐刘海简化成两三块宽线条，侧发贴面自然收束，短发是一整片深墨绿剪影，必要时一条干净奶白轮廓使之从背景分离。脸略微侧倾，一颗墨绿色椭圆眼，一只眯弯的眼，简短的笑嘴；自然，有小漫画主角的辨识度。人物脸足够大并靠画幅偏右下。平面剪纸图形，纯色 #23342F 与 #F5EEDF，线条圆润有力，粗细足以在 24px 下清晰，简练的专业卡通软件图标。不要写实人物，不要发丝纹理，不要腮红描线、字母、文字、手、身体、衣服细节、渐变、打光、3D效果。只交付单个正方形图标，底板外透明。</metadata>
