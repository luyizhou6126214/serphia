<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">Serphia</title>
  <desc id="description">炭黑圆角方块中，一条暖白色的小蛇盘成字母 S，抬头向外看。</desc>
  <metadata>内置 imagegen 生成设计稿，随后重绘为矢量。生成提示词：为 Serphia 设计一个方形桌面软件图标。炭黑圆角方块，暖白色的一条小蛇盘成大写 S，粗壮连续的身体，右上方圆钝的头略微回望，两枚短小倾斜的炭黑胶囊形眼睛。尾端简洁地向左上方收起。气质安静、机灵，像藏在桌面里的小伙伴。轮廓流畅、上下转弯之间留足黑色，缩到 24 像素仍可辨认。平面矢量质感，两种纯色，单个居中图标，无文字、舌头、鳞片、装饰、描边、渐变、浮雕或投影。圆角方块外透明。</metadata>
