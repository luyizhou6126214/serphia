<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">Serphia · 眨眼</title>
  <desc id="description">一个头顶小卷毛的奶白色角色从墨绿方块右下角探出来，眨眼微笑。</desc>
  <metadata>内置 imagegen 生成草图，矢量重绘定稿。提示词：Serphia 桌面软件图标，正方形画布，只画一枚成品。两色平涂，深墨绿色圆角底板，奶油白的无名小家伙从右下边缘探头。脸像一颗软乎乎、稍微歪着的饭团，脑袋上有一小撮向左倒的卷毛；它眨着一只眼，另一只是粗短的小黑豆，歪嘴浅浅一笑。表情像发现你也在看它，机灵而松弛。请像专业漫画家用剪纸作画：靠大胆的裁切、轮廓和留白讲清表情，脸颊和头顶几处饱满的弧线即可。脸占画面约七成，右边和下边自然被底板裁掉，眼睛与嘴留在中央安全区。每个五官短而厚，放到任务栏还能辨认。扁平二维轮廓，墨绿 #23342F 和奶白 #F5EEDF 两色，直接交付图标，底板外透明，无边框、阴影、质感、渐变或白色贴纸边；无身体、脖子、手脚、动物耳朵、字母、文字、蛇元素或产品样机。</metadata>
